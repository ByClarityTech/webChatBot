<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$subject</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f7; color: #1d1d1f; font-family: Arial, Helvetica, sans-serif; }
    .wrap { width: 100%; padding: 24px 16px; box-sizing: border-box; }
    .card { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 16px; }
    .button { display: inline-block; background: #5856d6; color: #ffffff !important; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; }
    .muted { font-size: 13px; color: #6e6e73; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>New booking request</h1>
      <p>A visitor asked for an appointment through the website assistant at $practice_name.</p>
      <p>The details are not included in this email. Sign in to see the request.</p>
      <p><a class="button" href="$bookings_url">Open bookings</a></p>
      <p class="muted">You receive this because you are on the notification list for $practice_name.</p>
    </div>
  </div>
</body>
</html>
